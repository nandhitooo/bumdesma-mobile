# CATATAN (multi-OS: CachyOS + Windows):
# JANGAN tulis org.gradle.java.home di sini. Path JDK itu absolut dan berbeda
# di tiap OS, dan file ini ikut ke-commit ke git — dulu isinya path JDK lokal
# per mesin sehingga Gradle langsung gagal di Windows
# ("Java home supplied is invalid").
#
# Project ini butuh JDK 17. Set per mesin, BUKAN lewat repo:
#   flutter config --jdk-dir="<path JDK 17>"
#
# Kenapa harus lewat flutter config, bukan JAVA_HOME? Urutan pencarian JDK di
# flutter_tools (lib/src/android/java.dart) adalah:
#   1. flutter config --jdk-dir   2. JDK bawaan Android Studio
#   3. JAVA_HOME                  4. java di PATH
# Jadi JAVA_HOME KALAH oleh JDK bawaan Android Studio. Di mesin uji JBR
# Android Studio adalah Java 25, sehingga tanpa jdk-dir build jalan dengan
# Java 25 dan gagal ("Java version used for the build is ... incompatible").
# Nilai jdk-dir tersimpan di ~/.flutter_settings per OS, tidak masuk repo.
#
# (Java binary dipakai? cek: flutter doctor -v | grep -i "Java binary").
