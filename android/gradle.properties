# CATATAN (multi-OS: CachyOS + Windows):
# JANGAN tulis org.gradle.java.home di sini. Path JDK itu absolut dan berbeda
# di tiap OS, dan file ini ikut ke-commit ke git — dulu isinya
# /home/nandhitooo/.jdks/jdk-21.0.12.1+1 sehingga Gradle langsung gagal di
# Windows ("Java home supplied is invalid").
#
# Project ini butuh JDK 21. Set per mesin, BUKAN lewat repo:
#   flutter config --jdk-dir="<path JDK 21>"
#
# Kenapa harus lewat flutter config, bukan JAVA_HOME? Urutan pencarian JDK di
# flutter_tools (lib/src/android/java.dart) adalah:
#   1. flutter config --jdk-dir   2. JDK bawaan Android Studio
#   3. JAVA_HOME                  4. java di PATH
# Jadi JAVA_HOME KALAH oleh JDK bawaan Android Studio. Di mesin ini JBR
# Android Studio 25 tidak didukung Gradle 8.14.1 sehingga build gagal dengan
# "The Java version used for the build is 25.0.2, which is incompatible".
# Nilai jdk-dir tersimpan di ~/.flutter_settings per OS, tidak masuk repo.
#
# (Java binary dipakai? cek: flutter doctor -v | grep -i "Java binary").
